[filament_switch_sensor BTT_v2_switch]
switch_pin:         ^PG12
pause_on_runout:    true
runout_gcode:
    PAUSE
    M117 "Filament swtich: runout"
insert_gcode:
    M117 "Filament switch: inserted"

[filament_motion_sensor BTT_v2_encoder]
switch_pin:         ^PG13
; detection_length:   2.88
detection_length:   5.00
extruder:           extruder
pause_on_runout:    false
runout_gcode:
    PAUSE
    M117 "Filament encoder: runout"
insert_gcode:
    M117 "Filament encoder: inserted"


